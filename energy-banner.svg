<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12081a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b5e" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8b2fd1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b2fd1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5c8a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="blurStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft ambient scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#ff2b5e" opacity="0.15">
    <animate attributeName="y" values="0;300;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- central pulsing core -->
  <circle cx="600" cy="150" r="120" fill="url(#coreGlow)" filter="url(#blurStrong)">
    <animate attributeName="r" values="100;140;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="150" r="45" fill="#ffffff" opacity="0.85" filter="url(#blurSoft)">
    <animate attributeName="r" values="35;50;35" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting rings -->
  <ellipse cx="600" cy="150" rx="180" ry="60" fill="none" stroke="#ff2b5e" stroke-width="1.5" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="150" rx="220" ry="90" fill="none" stroke="#8b2fd1" stroke-width="1" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 600 150" to="0 600 150" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating particles -->
  <g>
    <circle cx="150" cy="220" r="4" fill="url(#particleGlow)">
      <animate attributeName="cy" values="220;60;220" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="100" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="100;250;100" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="60" r="5" fill="url(#particleGlow)">
      <animate attributeName="cy" values="60;220;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="230" r="4" fill="url(#particleGlow)">
      <animate attributeName="cy" values="230;70;230" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="90" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="90;240;90" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="180" r="5" fill="url(#particleGlow)">
      <animate attributeName="cy" values="180;40;180" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="250;90;250" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="240" r="4" fill="url(#particleGlow)">
      <animate attributeName="cy" values="240;80;240" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle vignette edges -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#bg)" opacity="0">
  </rect>
</svg>
